<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trade Journal Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6feb">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>



</head>
<body>

<header>

<h1>📈 Trade Journal Pro</h1>

<div class="header-buttons">
<button id="exportBtn">Export</button>
<button id="importBtn">Import</button>
<input type="file" id="fileInput" hidden>
</div>

</header>

<section class="stats">

<div class="card">
<h2 id="totalTrades">0</h2>
<p>Total Trades</p>
</div>

<div class="card">
<h2 id="wins">0</h2>
<p>Wins</p>
</div>

<div class="card">
<h2 id="losses">0</h2>
<p>Losses</p>
</div>

<div class="card">
<h2 id="winrate">0%</h2>
<p>Win Rate</p>
</div>

<div class="card">
<h2 id="netProfit">$0</h2>
<p>Net Profit</p>
</div>

</section>

<section class="form">

<h2>Add Trade</h2>

<input type="date" id="date">

<select id="pair">
<option>XAUUSD</option>
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
</select>

<select id="direction">
<option>BUY</option>
<option>SELL</option>
</select>

<input type="text" id="setup" placeholder="Setup Name">

<input type="number" id="entry" placeholder="Entry">

<input type="number" id="sl" placeholder="Stop Loss">

<input type="number" id="tp" placeholder="Take Profit">

<input type="number" id="rr" placeholder="RR">

<input type="number" id="profit" placeholder="Profit/Loss">

<select id="result">
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<textarea id="notes" placeholder="Notes"></textarea>

<input type="file" id="image">

<button id="saveTrade">Save Trade</button>

</section>

<section class="chart">

<h2>Equity Curve</h2>

<canvas id="equityChart"></canvas>

</section>

<section>

<h2>Trade History</h2>

<table>

<thead>

<tr>

<th>Date</th>
<th>Pair</th>
<th>Side</th>
<th>Setup</th>
<th>RR</th>
<th>P/L</th>
<th>Result</th>
<th>Delete</th>

</tr>

</thead>

<tbody id="tradeTable">

</tbody>

</table>

</section>

<script src="script.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(() => console.log("Service Worker Registered"))
      .catch(err => console.log(err));
  });
}
</script>
</body>
</html>
