<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal Pro</title>

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="sidebar">
<h2>📈 Trade Journal</h2>

<ul>
<li><a href="#dashboard">Dashboard</a></li>
<li><a href="#journal">Journal</a></li>
<li><a href="#analytics">Analytics</a></li>
<li><a href="#funded">Funded</a></li>
</ul>

</div>

<div class="main">

<section id="dashboard">

<h1>Dashboard</h1>

<div class="cards">

<div class="card">
<h2 id="totalTrades">0</h2>
<p>Total Trades</p>
</div>

<div class="card">
<h2 id="winRate">0%</h2>
<p>Win Rate</p>
</div>

<div class="card">
<h2 id="netProfit">$0</h2>
<p>Net Profit</p>
</div>

<div class="card">
<h2 id="avgRR">0</h2>
<p>Average RR</p>
</div>

</div>

</section>

<section id="journal">

<h2>Add Trade</h2>

<input id="date" type="date">

<select id="pair">
<option>XAUUSD</option>
<option>EURUSD</option>
<option>GBPUSD</option>
<option>USDJPY</option>
</select>

<select id="side">
<option>BUY</option>
<option>SELL</option>
</select>

<input id="setup" placeholder="Setup (TJL/QML)">

<input id="entry" type="number" placeholder="Entry">

<input id="sl" type="number" placeholder="Stop Loss">

<input id="tp" type="number" placeholder="Take Profit">

<input id="rr" type="number" placeholder="Risk Reward">

<input id="profit" type="number" placeholder="Profit/Loss">

<select id="result">
<option>Win</option>
<option>Loss</option>
<option>BE</option>
</select>

<textarea id="notes" placeholder="Notes"></textarea>

<button onclick="saveTrade()">Save Trade</button>

</section>

<section id="analytics">

<h2>Equity Curve</h2>

<canvas id="equityChart"></canvas>

</section>

<section>

<h2>Trade History</h2>

<table>

<thead>

<tr>

<th>Date</th>
<th>Pair</th>
<th>Side</th>
<th>Setup</th>
<th>P/L</th>
<th>Result</th>

</tr>

</thead>

<tbody id="tradeTable">

</tbody>

</table>

</section>

</div>

<script src="script.js"></script>

<script>
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("sw.js");
});
}
</script>
</body>
</html>
